@if (state(); as s) {
  <div
    class="overlay"
    [class.closing]="!!s.closing"
    (click)="cancel()"
    (keydown)="onOverlayKey($event)"
    tabindex="-1"
  >
    <div
      class="dialog"
      [class.closing]="!!s.closing"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      (click)="$event.stopPropagation()"
      (keydown)="onOverlayKey($event)"
    >
      <div class="dialog-icon" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
          ></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>

      <h2 id="confirm-title" class="dialog-title">{{ s.title }}</h2>
      <p class="dialog-msg">{{ s.message }}</p>

      <div class="dialog-actions">
        <button type="button" class="btn btn-outline" (click)="cancel()">
          {{ s.cancelLabel ?? 'Cancelar' }}
        </button>
        <button type="button" class="btn btn-danger" (click)="confirm()" #confirmBtn>
          {{ s.confirmLabel ?? 'Eliminar' }}
        </button>
      </div>
    </div>
  </div>
}
